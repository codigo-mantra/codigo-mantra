    <script>
        (function () {
            const path = window.location.pathname;
            const isSchedulePage = path.includes('schedule-call') || path.includes('schedule_call');
            if (!isSchedulePage) {
                const keysToRemove = [
                    'schedule_call_date',
                    'schedule_call_time',
                    'schedule_call_tz',
                    'schedule_call_display_date',
                    'schedule_call_display_time_range',
                    'schedule_call_format',
                    'schedule_call_parent_page'
                ];
                keysToRemove.forEach(key => localStorage.removeItem(key));
            }
        })();
    </script>

    <script>
    // Override setTimeout to catch share-modal errors
    const _originalSetTimeout = window.setTimeout;
    window.setTimeout = function(fn, delay, ...args) {
        const wrappedFn = typeof fn === 'function' ? function() {
            try {
                fn.apply(this, args);
            } catch(e) {
                if (
                    e.message && e.message.includes("Cannot read properties of null") ||
                    e.stack && e.stack.includes('share-modal')
                ) {
                    return; // Silently ignore
                }
                throw e; // Re-throw other errors
            }
        } : fn;
        return _originalSetTimeout(wrappedFn, delay, ...args);
    };
</script>
